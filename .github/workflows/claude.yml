name: Claude Code Agent

run-name: >-
  ${{ (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       format('Claude Code Agent - PR {0}', github.event.issue.number)) ||
      (github.event_name == 'pull_request_review_comment' &&
       format('Claude Code Agent - PR {0}', github.event.pull_request.number)) ||
      'Claude Code Agent' }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install agent skills
        run: mkdir -p ~/.claude && cp -r .agents/skills ~/.claude/skills

      - name: Check PR run budget
        if: github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUDGET=3
          REPO="${{ github.repository }}"
          CURRENT_RUN_ID="${{ github.run_id }}"

          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUMBER="${{ github.event.issue.number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          RUN_NAME="Claude Code Agent - PR ${PR_NUMBER}"

          # Count completed runs of this workflow for this PR (by run display_title / name).
          # This counter is read via GITHUB_TOKEN (actions:read) — the Claude OAuth token
          # cannot delete or modify workflow runs, so this source is tamper-resistant.
          COMPLETED=$(gh api "repos/$REPO/actions/workflows/claude.yml/runs?per_page=100" \
            --jq "[.workflow_runs[] | select(.display_title == \"$RUN_NAME\" and (.id | tostring) != \"$CURRENT_RUN_ID\" and .status != \"cancelled\")] | length")

          echo "Completed runs for PR #${PR_NUMBER}: ${COMPLETED} (budget: ${BUDGET})"

          if [ "${COMPLETED}" -ge "${BUDGET}" ]; then
            HEAD_SHA=$(gh pr view "${PR_NUMBER}" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "unknown")
            RUN_URL="https://github.com/$REPO/actions/runs/$CURRENT_RUN_ID"
            gh pr comment "${PR_NUMBER}" --body "> **limit_exhausted** — Budget of ${BUDGET} agent runs exhausted for this PR.
          > SHA: \`${HEAD_SHA}\`
          > Logs: ${RUN_URL}
          > Status: needs human — no further automated runs will start."
            echo "Budget exhausted. Exiting without calling model."
            exit 0
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          trigger_phrase: /claude
          allowed_bots: github-actions
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(npm:*)",
                  "Bash(npx:*)",
                  "Bash(node:*)",
                  "Bash(git:*)",
                  "Bash(gh:*)",
                  "Bash(cat:*)",
                  "Bash(ls:*)",
                  "Bash(find:*)",
                  "Bash(grep:*)",
                  "Bash(mkdir:*)",
                  "Bash(cp:*)",
                  "Bash(mv:*)",
                  "Bash(echo:*)",
                  "Read(**)",
                  "Write(**)",
                  "Edit(**)"
                ]
              }
            }

  auto-triage:
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: auto-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install agent skills
        run: mkdir -p ~/.claude && cp -r .agents/skills ~/.claude/skills

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          settings: |
            {"permissions":{"allow":["Bash(gh issue view:*)", "Bash(gh issue comment:*)", "Bash(gh issue edit:*)", "Bash(gh label list:*)", "Bash(gh issue list:*)"]}}
          prompt: |
            Ты — агент триажа. Открылось новое обращение issue #${{ github.event.issue.number }}.

            Заголовок: ${{ github.event.issue.title }}
            Описание: ${{ github.event.issue.body }}

            Сделай следующее (не жди разрешения):
            1. Прочитай GLOSSARY.md и docs/agents/triage-labels.md чтобы понять домен и метки.
            2. Проверь кодовую базу: есть ли уже такая функция (ищи по смыслу, не по словам)?
            3. Определи категорию: bug или enhancement.
            4. Составь разбор и список уточняющих вопросов если данных не хватает.
            5. Опубликуй разбор командой: gh issue comment ${{ github.event.issue.number }} --body "..."
               Начни комментарий строкой: > *This was generated by AI during triage.*
            6. Примени метку needs-triage: gh issue edit ${{ github.event.issue.number }} --add-label "needs-triage"

            Код не меняй. Выполняй шаги последовательно.
