name: Claude Code Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install agent skills
        run: mkdir -p ~/.claude && cp -r .agents/skills ~/.claude/skills

      - uses: anthropics/claude-code-action@v1
        with:
          trigger_phrase: /claude
          allowed_bots: github-actions
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  auto-triage:
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: auto-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install agent skills
        run: mkdir -p ~/.claude && cp -r .agents/skills ~/.claude/skills

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          settings: |
            {"permissions":{"allow":["Bash(gh issue view:*)", "Bash(gh issue comment:*)", "Bash(gh issue edit:*)", "Bash(gh label list:*)", "Bash(gh issue list:*)"]}}
          prompt: |
            Ты — агент триажа. Открылось новое обращение issue #${{ github.event.issue.number }}.

            Заголовок: ${{ github.event.issue.title }}
            Описание: ${{ github.event.issue.body }}

            Сделай следующее (не жди разрешения):
            1. Прочитай GLOSSARY.md и docs/agents/triage-labels.md чтобы понять домен и метки.
            2. Проверь кодовую базу: есть ли уже такая функция (ищи по смыслу, не по словам)?
            3. Определи категорию: bug или enhancement.
            4. Составь разбор и список уточняющих вопросов если данных не хватает.
            5. Опубликуй разбор командой: gh issue comment ${{ github.event.issue.number }} --body "..."
               Начни комментарий строкой: > *This was generated by AI during triage.*
            6. Примени метку needs-triage: gh issue edit ${{ github.event.issue.number }} --add-label "needs-triage"

            Код не меняй. Выполняй шаги последовательно.
